# NOT YET RUN on GitHub Actions. Written in Stage 07, first run will be the check.
name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install gdtoolkit && find game tests -name '*.gd' -exec gdparse {} \;
